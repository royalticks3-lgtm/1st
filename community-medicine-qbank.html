<head>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d1a;
    --surface: #16162a;
    --surface2: #1e1e38;
    --border: #2d2d4e;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --dim: #6b7280;
    --accent: #6d28d9;
    --accent-light: #a78bfa;
  }

  body {
    min-height: 100vh;
    background: var(--bg);
    font-family: 'Source Serif 4', Georgia, serif;
    color: var(--text);
    padding-bottom: 60px;
  }

  /* ── HEADER ── */
  .header {
    background: linear-gradient(160deg,#1a1040 0%,#2d1b6e 50%,#1a1040 100%);
    padding: 28px 20px 22px;
    text-align: center;
    border-bottom: 2px solid #6d28d9;
  }
  .header-sub {
    font-size: 11px;
    letter-spacing: 5px;
    color: var(--accent-light);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .header h1 {
    font-family: 'Playfair Display', Georgia, serif;
    color: #fff;
    font-size: clamp(17px,5vw,26px);
    margin-bottom: 4px;
    font-weight: 700;
  }
  .header-desc {
    color: #c4b5fd;
    font-size: 13px;
    margin-bottom: 16px;
  }
  .legend {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 3px 11px;
  }
  .legend-label { font-weight: 700; font-size: 12px; }
  .legend-desc  { color: var(--accent-light); font-size: 11px; }

  /* ── TABS ── */
  .tabs {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 16px 16px 0;
    flex-wrap: wrap;
  }
  .tab-btn {
    padding: 10px 22px;
    border-radius: 10px;
    border: 2px solid var(--border);
    background: var(--surface);
    color: #9ca3af;
    font-weight: 400;
    font-size: 14px;
    cursor: pointer;
    font-family: 'Source Serif 4', Georgia, serif;
    transition: all 0.18s;
  }
  .tab-btn.active {
    color: #fff;
    font-weight: 700;
  }
  .tab-count { margin-left: 6px; font-size: 11px; opacity: 0.8; }

  /* ── CONTROLS ── */
  .controls {
    max-width: 760px;
    margin: 14px auto 0;
    padding: 0 14px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .search-input {
    flex: 1;
    min-width: 150px;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    outline: none;
    font-family: 'Source Serif 4', Georgia, serif;
  }
  .filter-btn {
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: #9ca3af;
    font-size: 12px;
    cursor: pointer;
    font-family: 'Source Serif 4', Georgia, serif;
    transition: all 0.15s;
  }
  .filter-btn.active { color: #fff; border-width: 2px; }

  /* ── STAT BAR ── */
  .stat-bar {
    max-width: 760px;
    margin: 10px auto 0;
    padding: 0 14px;
  }
  .stat-bar-inner {
    background: var(--surface);
    border-radius: 8px;
    padding: 9px 14px;
    color: var(--muted);
    font-size: 12px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    align-items: center;
  }
  .stat-bar-inner strong { color: var(--text); }
  .stat-sort { margin-left: auto; color: #6d28d9; }

  /* ── CARDS ── */
  .cards {
    max-width: 760px;
    margin: 12px auto 0;
    padding: 0 14px;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .card {
    border-radius: 12px;
    padding: 13px 15px;
    cursor: pointer;
    transition: box-shadow 0.15s;
    border-width: 2px;
    border-style: solid;
  }
  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }
  .card-left { flex: 1; }
  .card-tags { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-bottom: 7px; }
  .tag {
    color: #fff;
    border-radius: 20px;
    padding: 2px 10px;
    font-size: 11px;
    font-weight: 700;
  }
  .card-topic { font-weight: 700; font-size: 14.5px; color: #1e293b; line-height: 1.4; }
  .card-arrow { color: #64748b; font-size: 18px; user-select: none; padding-top: 2px; }

  .card-body {
    margin-top: 11px;
    padding-top: 11px;
    border-top-style: dashed;
    border-top-width: 1px;
  }
  .card-body-label { font-size: 12px; color: #475569; margin-bottom: 7px; font-weight: 600; }
  .years-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
  .year-chip {
    background: #fff;
    border-radius: 6px;
    padding: 3px 10px;
    font-size: 11.5px;
    color: #1e293b;
    font-weight: 500;
    border-width: 1px;
    border-style: solid;
  }

  .empty { text-align: center; color: #6b7280; padding: 40px; font-size: 15px; }

  .footer { text-align: center; margin-top: 28px; color: #4b5563; font-size: 11px; }
</style>
</head>

  return           { bg:"#f0fdf4", border:"#22c55e", tag:"#16a34a", label:"✓ Low" };
}

let activeTab    = "15 Marks";
let activeFilter = "all";
let expanded     = {};

// Build tabs
const tabsEl = document.getElementById("tabs");
Object.entries(TAB_META).forEach(([t, m]) => {
  const btn = document.createElement("button");
  btn.className = "tab-btn" + (t === activeTab ? " active" : "");
  btn.id = "tab-" + t;
  btn.innerHTML = `${m.emoji} ${t}<span class="tab-count">(${DATA[t].length})</span>`;
  btn.onclick = () => switchTab(t);
  tabsEl.appendChild(btn);
});

function switchTab(t) {
  document.getElementById("tab-" + activeTab).classList.remove("active");
  document.getElementById("tab-" + activeTab).style.borderColor = "";
  document.getElementById("tab-" + activeTab).style.background  = "";
  document.getElementById("tab-" + activeTab).style.color       = "";

  activeTab = t;
  activeFilter = "all";
  expanded = {};
  document.getElementById("searchInput").value = "";

  const btn = document.getElementById("tab-" + t);
  btn.classList.add("active");
  styleActiveTab();
  styleActiveFilter();
  render();
}

function styleActiveTab() {
  Object.entries(TAB_META).forEach(([t, m]) => {
    const btn = document.getElementById("tab-" + t);
    if (t === activeTab) {
      btn.style.borderColor = m.color;
      btn.style.background  = m.color;
      btn.style.color       = "#fff";
    } else {
      btn.style.borderColor = "";
      btn.style.background  = "";
      btn.style.color       = "";
    }
  });
}

function setFilter(f) {
  activeFilter = f;
  expanded = {};
  styleActiveFilter();
  render();
}

function styleActiveFilter() {
  const color = TAB_META[activeTab].color;
  document.querySelectorAll(".filter-btn").forEach(btn => {
    const f = btn.dataset.filter;
    if (f === activeFilter) {
      btn.style.borderColor = color;
      btn.style.borderWidth = "2px";
      btn.style.background  = color;
      btn.style.color       = "#fff";
    } else {
      btn.style.borderColor = "";
      btn.style.borderWidth = "";
      btn.style.background  = "";
      btn.style.color       = "";
    }
  });
}

function getFiltered() {
  const search = document.getElementById("searchInput").value.toLowerCase();
  return DATA[activeTab]
    .filter(q => {
      if (activeFilter === "very_high") return q.count >= 6;
      if (activeFilter === "high")      return q.count >= 4 && q.count < 6;
      if (activeFilter === "medium")    return q.count === 3;
      if (activeFilter === "low")       return q.count <= 2;
      return true;
    })
    .filter(q => q.topic.toLowerCase().includes(search))
    .sort((a, b) => b.count - a.count);
}

function render() {
  const filtered = getFiltered();
  const meta = TAB_META[activeTab];
  const totalCount = DATA[activeTab].reduce((s,q) => s + q.count, 0);

  // stat bar
  document.getElementById("statBar").innerHTML =
    `<span>Showing <strong>${filtered.length}</strong> topics</span>
     <span>Total appearances <strong>${totalCount}</strong></span>
     <span class="stat-sort">Sorted by frequency ↓</span>`;

  // cards
  const cardsEl = document.getElementById("cards");
  if (filtered.length === 0) {
    cardsEl.innerHTML = `<div class="empty">No topics found for this filter.</div>`;
    return;
  }

  cardsEl.innerHTML = filtered.map((q, i) => {
    const rm = repeatMeta(q.count);
    const open = expanded[i];
    return `
      <div class="card" data-i="${i}"
        style="background:${rm.bg};border-color:${rm.border};${open ? `box-shadow:0 4px 16px ${rm.border}44` : ''}">
        <div class="card-top">
          <div class="card-left">
            <div class="card-tags">
              <span class="tag" style="background:${rm.tag}">${rm.label}</span>
              <span class="tag" style="background:${meta.color}">${q.count}× repeated</span>
            </div>
            <div class="card-topic">${q.topic}</div>
          </div>
          <div class="card-arrow">${open ? "▲" : "▼"}</div>
        </div>
        ${open ? `
        <div class="card-body" style="border-top-color:${rm.border}">
          <div class="card-body-label">📅 Appeared in:</div>
          <div class="years-wrap">
            ${q.years.map(y => `<span class="year-chip" style="border-color:${rm.border}">${y}</span>`).join("")}
          </div>
        </div>` : ""}
      </div>`;
  }).join("");

  cardsEl.querySelectorAll(".card").forEach(card => {
    card.onclick = () => {
      const i = +card.dataset.i;
      expanded[i] = !expanded[i];
      render();
    };
  });
}

// Init
styleActiveTab();
styleActiveFilter();
render();
</script>
</body>
</html>
